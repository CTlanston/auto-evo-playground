name: shadow-ci

# Untrusted-code lane. Runs the suite that the agent's code is judged on.
# CRITICAL: this workflow MUST NOT carry any secret. Agent-written code
# (including tests) runs here, so a secret leak here is a real risk. See
# docs/upgrade-plan.md §3.2.
#
# Fast lane: lint + unit tests, target ≤1 min. Slow lane: integration +
# coverage, runs in parallel — does NOT gate the fast verdict.

on:
  push:
    branches:
      - "shadow/**"
  pull_request:
    branches:
      - main

permissions:
  # Read-only on contents. PR comment write is fine — no privileged secrets
  # are exposed by adding a comment.
  contents: read
  pull-requests: write

concurrency:
  # New push to same branch supersedes the previous run.
  group: shadow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----- FAST LANE ----------------------------------------------------------
  fast-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet ruff
      - run: ruff check .

  fast-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --quiet pytest pytest-cov
      - name: Run fast unit tests (fail fast, no integration)
        # pyproject/pytest.ini enforce --cov-fail-under=100 which is too
        # strict for the fast lane (it gates on slow-coverage instead).
        # Override here.
        run: |
          mkdir -p test-results
          pytest tests/ -q -x \
            --ignore-glob='tests/integration*' \
            --junit-xml=test-results/junit-fast.xml \
            --cov=src --cov-report=xml:test-results/coverage-fast.xml \
            --cov-fail-under=0
      - name: Upload fast-lane artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-fast
          path: test-results/
          retention-days: 7

  # ----- SLOW LANE (parallel — does not block the fast verdict) ------------
  slow-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --quiet pytest pytest-cov
      - name: Run integration suite (if present)
        run: |
          mkdir -p test-results
          if [ -f scripts/integration.sh ]; then
            bash scripts/integration.sh
          elif compgen -G "tests/integration*" > /dev/null; then
            pytest tests/integration -q \
              --junit-xml=test-results/junit-integration.xml \
              --cov=src --cov-report=xml:test-results/coverage-integration.xml \
              --cov-fail-under=0
          else
            echo "::notice::No integration suite found — skipping."
          fi
      - name: Upload slow-lane artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: test-results/
          retention-days: 7

  slow-coverage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Coverage is informational at MVP — never block the fast verdict on it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --quiet pytest pytest-cov coverage
      - name: Full coverage run (gate at 30%, informational)
        run: |
          mkdir -p test-results
          pytest tests/ -q \
            --cov=src --cov-report=xml:test-results/coverage-full.xml \
            --cov-report=term-missing \
            --cov-fail-under=30 || echo "::warning::coverage below 30% gate"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-coverage
          path: test-results/
          retention-days: 7
